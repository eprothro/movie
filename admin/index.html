<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guest book · Movie night</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b2c4e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/site.css">
  <style>html{background:#1b2c4e;color:#f4efe6}body{margin:0}</style>
  <script>
    try {
      if (sessionStorage.getItem("prothro-movie-admin-pin")) {
        document.documentElement.classList.add("has-pin");
      }
    } catch (e) {}
  </script>
</head>
<body class="admin">
  <div class="sky" aria-hidden="true">
    <svg class="stars" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <circle cx="12" cy="14" r="0.4" fill="#fff" opacity="0.7"/>
      <circle cx="30" cy="8" r="0.22" fill="#fff" opacity="0.45"/>
      <circle cx="70" cy="16" r="0.3" fill="#f3d7a1" opacity="0.55"/>
      <circle cx="86" cy="28" r="0.2" fill="#fff" opacity="0.4"/>
      <circle cx="48" cy="22" r="0.18" fill="#fff" opacity="0.4"/>
      <circle cx="18" cy="40" r="0.24" fill="#fff" opacity="0.35"/>
      <circle cx="78" cy="60" r="0.2" fill="#fff" opacity="0.35"/>
      <circle cx="40" cy="78" r="0.26" fill="#f3d7a1" opacity="0.4"/>
    </svg>
    <div class="grain"></div>
  </div>
  <main class="wrap">
    <section class="pin-screen" id="pin-screen">
      <div class="booth" aria-hidden="true">
        <svg viewBox="0 0 160 40">
          <rect x="6" y="12" width="34" height="18" rx="3" fill="#f4efe6"/>
          <rect x="12" y="8" width="12" height="6" rx="1.5" fill="#e7dccb"/>
          <circle cx="36" cy="21" r="3" fill="#ffd7a0"/>
          <polygon points="40,16 92,6 92,36 40,26" fill="#f0d7a4" opacity="0.38"/>
          <circle cx="118" cy="20" r="8" fill="#f6e7c4"/>
          <circle cx="122" cy="17" r="6" fill="#1b2c4e"/>
        </svg>
      </div>
      <p class="eyebrow">Projection booth</p>
      <h1>The booth</h1>
      <p class="lede">Evan and Julie</p>
      <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>
      <p class="pin-hint" id="pin-hint">Four to eight digits</p>
      <p class="sr-only" id="pin-live" aria-live="polite"></p>
      <div class="keypad-wrap">
        <div class="keypad" id="keypad" role="group" aria-label="PIN keypad">
          <button type="button" data-digit="1">1</button>
          <button type="button" data-digit="2">2</button>
          <button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button>
          <button type="button" data-digit="5">5</button>
          <button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button>
          <button type="button" data-digit="8">8</button>
          <button type="button" data-digit="9">9</button>
          <button type="button" class="del" id="pin-del" aria-label="Delete digit">Del</button>
          <button type="button" data-digit="0">0</button>
          <button type="button" class="del" id="pin-clear" aria-label="Clear PIN">Clear</button>
        </div>
        <button type="button" class="unlock" id="unlock" disabled>Unlock</button>
        <p class="pin-error" id="pin-error" role="alert"></p>
      </div>
    </section>

    <p id="opening" class="lede">Warming up the lamp…</p>

    <section class="book" id="book" hidden>
      <div class="book-head">
        <div>
          <p class="eyebrow">Projection booth</p>
          <h2>The booth</h2>
        </div>
        <div class="book-actions">
          <button type="button" class="link" id="refresh">Refresh</button>
          <button type="button" class="link" id="lock">Lock</button>
        </div>
      </div>
      <p class="book-error" id="book-error" role="alert" hidden></p>
      <div class="stats" id="stats"></div>
      <div class="switches">
        <button type="button" class="toggle" id="toggle-rsvp" aria-pressed="true">
          <span><strong>RSVPs</strong><small id="rsvp-switch-label">Open</small></span>
          <span class="switch" aria-hidden="true"><i></i></span>
        </button>
        <button type="button" class="toggle" id="toggle-vote" aria-pressed="true">
          <span><strong>Voting</strong><small id="vote-switch-label">Open</small></span>
          <span class="switch" aria-hidden="true"><i></i></span>
        </button>
      </div>
      <p class="quiet" id="no-line" hidden></p>
      <div id="guest-list"></div>
    </section>
  </main>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
